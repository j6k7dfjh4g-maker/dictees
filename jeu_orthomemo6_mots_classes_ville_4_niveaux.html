<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orthomémo 6 – Les mots des classes de ville</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f2f5fa;color:#203047;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:650px;margin:auto}h1{text-align:center;font-size:26px;margin:12px 0 4px}.sub{text-align:center;color:#65748a;margin:0 0 22px}.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}.level{border:0;border-radius:12px;padding:14px 8px;background:#dce6f3;color:#263a55;font-weight:700;font-size:15px}.level.active{background:#315f9c;color:white}.panel{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px #233c5b14}.progress{color:#66758b;font-size:14px}.prompt{text-align:center;font-size:19px;font-weight:650;margin:18px 0}.play{width:100%;border:0;border-radius:13px;padding:16px;background:#247b61;color:white;font-size:20px;font-weight:750;margin-bottom:14px}input{width:100%;font-size:20px;padding:14px;border:2px solid #ccd6e3;border-radius:12px}.action{width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;background:#315f9c;color:white;font-size:17px;font-weight:700}.next{background:#247b61;display:none}.feedback{min-height:28px;text-align:center;margin-top:12px;font-weight:650}.small{text-align:center;color:#77859a;font-size:13px;line-height:1.5;margin-top:15px}.hidden{display:none}.result{text-align:center;font-size:22px;font-weight:750}@media(max-width:390px){body{padding:12px}.panel{padding:15px}}
</style></head><body><main class="wrap">
<h1>Orthomémo 6</h1><p class="sub">Les mots des classes de ville</p>
<div class="levels">
<button class="level active" data-level="1">Niveau 1 · Colonne 1</button>
<button class="level" data-level="2">Niveau 2 · Colonne 2</button>
<button class="level" data-level="3">Niveau 3 · Colonne 3</button>
<button class="level" data-level="4">Niveau 4 · Défi final</button>
</div>
<section class="panel" id="game"><div class="progress" id="progress"></div>
<div class="prompt">Écoute le mot, puis écris-le correctement.</div>
<button class="play" id="play">▶ ÉCOUTER</button>
<input id="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Écris le mot ici">
<button class="action" id="verify">Vérifier</button><button class="action next" id="next">Mot suivant</button>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="small">Tu peux réécouter chaque mot autant de fois que nécessaire. Les mots ne sont pas affichés avant ta réponse.</div></section>
<section class="panel hidden" id="finished"><p class="result" id="result"></p><p id="summary"></p><button class="action" id="restart">Recommencer ce niveau</button></section>
</main>
<script>
const lists={"1": ["la maison communale", "le bourgmestre", "les échevins", "le mariage", "la naissance"], "2": ["la commune", "la maison", "la façade", "un architecte", "une statue"], "3": ["la carte d’identité", "la salle des guichets", "les ânes", "les cerises", "les vitraux"], "4": ["la maison communale", "le bourgmestre", "les échevins", "le mariage", "la naissance", "la commune", "la maison", "la façade", "un architecte", "une statue", "la carte d’identité", "la salle des guichets", "les ânes", "les cerises", "les vitraux"]};let level="1",items=[],index=0,score=0,checked=false;
const $=id=>document.getElementById(id);
const normalize=s=>s.toLocaleLowerCase("fr").normalize("NFC").trim().replace(/\\s+/g," ");
function start(l){level=l;items=[...lists[l]].sort(()=>Math.random()-.5);index=0;score=0;checked=false;
document.querySelectorAll(".level").forEach(b=>b.classList.toggle("active",b.dataset.level===l));
$("game").classList.remove("hidden");$("finished").classList.add("hidden");update();}
function update(){$("progress").textContent=`Mot ${index+1} sur ${items.length} · Score : ${score}`;$("answer").value="";$("answer").disabled=false;$("feedback").textContent="";$("verify").style.display="block";$("next").style.display="none";checked=false;$("answer").focus();}
function speak(){const fb=$("feedback");if(!("speechSynthesis"in window)||!("SpeechSynthesisUtterance"in window)){fb.textContent="Audio non pris en charge. Essaie d’ouvrir le jeu dans Safari.";return;}
const synth=window.speechSynthesis;try{synth.cancel();const u=new SpeechSynthesisUtterance(items[index]);u.lang="fr-FR";u.rate=.78;u.pitch=1;u.volume=1;
const voice=()=>{const vs=synth.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()==="fr-be")||vs.find(v=>v.lang.toLowerCase().startsWith("fr-fr"))||vs.find(v=>v.lang.toLowerCase().startsWith("fr"))||null;};voice();
u.onstart=()=>{fb.textContent="🔊 Écoute bien…";fb.style.color="#247b61";};u.onend=()=>{if(!checked)fb.textContent="Tu peux réécouter le mot.";};
u.onerror=e=>{fb.textContent="Erreur audio ("+(e.error||"lecture impossible")+"). Vérifie le volume et le mode silencieux de l’iPhone.";fb.style.color="#b33";};
setTimeout(()=>{try{synth.resume();voice();synth.speak(u);}catch(e){fb.textContent="Impossible de lancer le son. Essaie dans Safari.";}},120);
}catch(e){fb.textContent="Impossible de lancer la lecture audio. Essaie dans Safari.";}}
function check(){if(checked)return;const ok=normalize($("answer").value)===normalize(items[index]);checked=true;
if(ok){score++;$("feedback").textContent="✓ Bravo, c’est correct !";$("feedback").style.color="#16834e";}else{$("feedback").textContent="✗ La bonne réponse était : "+items[index];$("feedback").style.color="#b33";}
$("answer").disabled=true;$("verify").style.display="none";$("next").style.display="block";$("next").textContent=index===items.length-1?"Voir mon résultat":"Mot suivant";$("progress").textContent=`Mot ${index+1} sur ${items.length} · Score : ${score}`;}
function advance(){if(index<items.length-1){index++;update();}else{$("game").classList.add("hidden");$("finished").classList.remove("hidden");$("result").textContent=`Résultat : ${score} / ${items.length}`;$("summary").textContent=score===items.length?"Excellent ! Tout est juste.":"Bravo pour tes efforts ! Tu peux recommencer pour progresser.";}}
document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>start(b.dataset.level)));
$("play").addEventListener("click",speak);$("verify").addEventListener("click",check);$("next").addEventListener("click",advance);$("restart").addEventListener("click",()=>start(level));
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){if(checked)advance();else check();}});start("1");
</script></body></html>
